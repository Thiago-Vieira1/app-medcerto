services:
  - type: web
    name: medcerto-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/schema/
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
